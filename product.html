<script>
(()=>{const mark=img=>{if(!(img instanceof HTMLImageElement)||img.dataset.fallbackHandled)return;const src=img.getAttribute('src');if(src&&!(img.complete&&img.naturalWidth===0))return;img.dataset.fallbackHandled='true';img.classList.add('image-failed');const box=img.closest('.product-image-wrap,.detail-photo,.bag-line');if(box){box.classList.add('image-placeholder');box.dataset.imageInitial=((img.alt||'Yazonistore product').trim().charAt(0)||'Y').toUpperCase()}};document.addEventListener('error',e=>mark(e.target),true);const scan=()=>document.querySelectorAll('img').forEach(mark);new MutationObserver(scan).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});scan()})();
