<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f7f4">
<meta name="description" content="Shop the current Yazonistore collection.">
<title>Shop — Yazonistore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=calm-store-20261017b">
<link rel="stylesheet" href="premium.css?v=calm-store-20261017b">
</head>
<body class="premium-calm">
<header class="calm-header">
<a class="calm-wordmark" href="index.html">YAZONISTORE</a>
<nav class="calm-nav" aria-label="Main navigation"><a href="shop.html" aria-current="page">Shop</a><button class="calm-bag" type="button" data-open-bag>Bag <span data-bag-count>0</span></button></nav>
</header>
<main class="calm-shop">
<div class="calm-shop-heading"><div><p class="calm-kicker">Yazonistore / Collection</p><h1>Shop all.</h1></div><p>Useful products for everyday spaces. Browse the collection or search for something specific.</p></div>
<div class="calm-shop-toolbar">
<span class="calm-shop-count"><strong data-product-count>—</strong> products</span>
<div class="calm-shop-tools">
<label class="calm-shop-search"><span class="sr-only">Search products</span><input id="shopSearch" type="search" placeholder="Search products" aria-label="Search products"></label>
<label class="calm-shop-sort"><span class="sr-only">Sort products</span><select id="sortSelect" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></label>
</div>
</div>
<div class="product-grid calm-product-grid" id="productGrid" aria-live="polite"></div>
<div class="empty-state" id="emptyState" hidden><h2>No products found.</h2><p>Try another search.</p><button class="button button-outline" type="button" id="clearShopFilters">Clear search</button></div>
</main>
<footer class="calm-footer"><a class="calm-wordmark" href="index.html">YAZONISTORE</a><nav aria-label="Footer"><a href="faq.html">FAQ</a><a href="shipping.html">Shipping</a><a href="contact.html">Contact</a></nav><span>© <span data-year></span> Yazonistore</span></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=calm-store-20261017b"></script>
<script>document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());</script>
</body>
</html>
