<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ed">
<meta name="description" content="Shop the Yazonistore collection.">
<title>Shop — Yazonistore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=language-currency-20261015">
</head>
<body>
<div class="announcement">A considered collection for everyday living</div>
<header class="site-header">
<a class="wordmark" href="index.html" aria-label="Yazonistore home">yazoni<span>.</span></a>
<nav class="desktop-nav" aria-label="Main navigation"><a href="shop.html" aria-current="page">Shop</a><a href="faq.html">FAQ</a></nav>
<div class="header-actions"><button class="bag-button" type="button" data-open-bag aria-label="Open shopping bag">Bag <span data-bag-count>0</span></button></div>
</header>
<main class="minimal-shop section-wrap">
<div class="minimal-shop-heading">
<div><p class="eyebrow">THE YAZONI COLLECTION</p><h1>Shop <em>all.</em></h1></div>
<p class="minimal-shop-subtitle">Useful things for everyday living.</p>
</div>
<div class="minimal-shop-toolbar">
<div class="category-filters" id="categoryFilters" aria-label="Filter products by category">
<button type="button" class="filter-chip active" data-category="All">All products</button>
<button type="button" class="filter-chip" data-category="Desk">Desk</button>
<button type="button" class="filter-chip" data-category="Everyday">Everyday</button>
<button type="button" class="filter-chip" data-category="Travel">Travel</button>
</div>
<div class="minimal-shop-tools">
<label class="minimal-search"><span class="sr-only">Search products</span><input id="shopSearch" type="search" placeholder="Search products…" aria-label="Search products"><span aria-hidden="true">⌕</span></label>
<label class="minimal-sort"><span class="sr-only">Sort products</span><select id="sortSelect" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></label>
</div>
</div>
<div class="minimal-result-line"><span><strong data-product-count>—</strong> products</span><span>Thoughtfully picked. Simply useful.</span></div>
<div class="product-grid shop-grid minimal-product-grid" id="productGrid" aria-live="polite"></div>
<div class="empty-state large-empty minimal-empty" id="emptyState"><h2>No products found.</h2><p>Try another search or category.</p><button class="button button-outline" type="button" id="clearShopFilters">Clear filters ↗</button></div>
</main>
<footer class="site-footer"><a class="wordmark" href="index.html">yazoni<span>.</span></a><div class="footer-links"><a href="shop.html">Shop</a><a href="faq.html">FAQ</a></div><div class="footer-bottom"><span>© <span data-year></span> Yazonistore</span><a href="admin.html">Store admin</a></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=language-currency-20261015"></script>
</body>
</html>
